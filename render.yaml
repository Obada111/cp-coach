# Render Blueprint for the Codeforces Coach backend.
# The frontend is deployed separately on Vercel; this service runs the API.
# Configured for Render Free ($0.00/month) with durable cloud database sync
# to Supabase PostgreSQL and resilient client-side state caching.

services:
  - type: web
    name: cp-coach-api
    env: node
    region: oregon
    plan: free
    buildCommand: "npm --prefix backend install --include=dev && npm --prefix backend run build"
    startCommand: npm --prefix backend start
    healthCheckPath: /api/public/health
    envVars:
      - key: NODE_VERSION
        value: "24.13.0"
      - key: NODE_ENV
        value: production
      - key: PUBLIC_MODE
        value: "true"
      - key: ALLOW_EPHEMERAL_DB_CACHE
        value: "true"
      - key: CLOUDFLARE_NOTIFICATIONS_URL
        sync: false
      - key: CLOUDFLARE_NOTIFICATIONS_API_SECRET
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CODEFORCES_CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: HOST
        value: "0.0.0.0"
      - key: DB_DIR
        value: "/tmp/cp_coach"
      - key: DB_BACKUP_DIR
        value: "/tmp/cp_coach/backups"
      - key: DB_BACKUP_INTERVAL_HOURS
        value: "24"
      - key: DB_BACKUP_RETENTION
        value: "7"
      - key: DB_BACKUP_ON_STARTUP
        value: "false"
      - key: LEGACY_MIGRATION_SECRET
        sync: false
      - key: TIMEZONE
        value: "Asia/Hebron"
      - key: CODEFORCES_REQUEST_TIMEOUT_MS
        value: "10000"
      - key: PERF_TIMINGS
        value: "true"
      - key: CORS_ORIGINS
        value: "https://cp-coach-six.vercel.app"
      - key: ALLOW_VERCEL_PREVIEWS
        value: "true"
      # Optional: add COACH_ADMIN_TOKEN in the Render dashboard to enable the
      # private legacy /api/admin routes. Without it they return 404.
      - key: SUBMISSIONS_TTL_MS
        value: "300000"
      - key: PROFILE_TTL_MS
        value: "300000"
      - key: RATING_TTL_MS
        value: "3600000"
      - key: CONTESTS_TTL_MS
        value: "7200000"
      - key: PROBLEMSET_TTL_MS
        value: "86400000"
      - key: ACTIVE_WINDOW_MS
        value: "1800000"
